    adjust: [kick_mm, kick_s, hold_s, dispersion_mismatch_max, isotropy_max, repeat_pickups, f0_repeat_rel_max, zeta_repeat_rel_max]
    inputs:
      - Front-end that passed the gate
    criteria:
      dispersion:
        text: omega0 within dispersion_mismatch_max of the dispersion relation at the measured h
        kind: auto
        metric: dispersion_mismatch
        op: abs_le
        coeff: dispersion_mismatch_max
      repeat_f0:
        text: f0 spread over repeats at most f0_repeat_rel_max
        kind: auto
        metric: f0_rel_spread
        op: le
        coeff: f0_repeat_rel_max
      repeat_zeta:
        text: zeta spread over repeats at most zeta_repeat_rel_max
        kind: auto
        metric: zeta_rel_spread
        op: le
        coeff: zeta_repeat_rel_max
    output: data/params/<id>.yaml per pickup
