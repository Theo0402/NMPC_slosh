# The stages of the hardware phase, from a finished bench to the with-vs-without comparison
# (codebase plan §12). The workbench reads this file; docs/stages.md is generated from it with
#     python -m tools.workbench.gen_docs
# Readable by tools/yamlmini.py (block style, no flow mappings, no multi-line strings).
#
# Per stage:
#   num, group, title, purpose, plan    what it is and where the plans define it
#   modes        dry-run | mock | arm (a tool that talks to the arm) | form (a checklist on the page)
#                | analysis (a script on recorded data, on this machine)
#   status       built | planned (the tool does not exist yet) | conditional (only if a gate says so)
#   tool         python module run as `python -m <tool> --<mode>`, or "form", or the planned path
#   requires     stages that must have passed (on the arm, for tool stages) before an arm run
#   inputs       what the stage needs; adjust: coefficients the owner may change (params.schema.yaml)
#   files        config the inputs hash covers (path or path#key.path); a change makes results stale
#   criteria     id -> text, kind (auto: a metric checked against a value or a coefficient;
#                operator: ticked on the page), metric, op, value | coeff
#   output       what an accepted run leaves behind
#   gate         true for the host check and the per-session checklists: they lock what follows,
#                but their new results and coefficients make nothing downstream stale
schema: 1
groups:
  g0: Pre-flight and safety
  g1: Robot connection
  g2: Arm calibration
  g3: Camera calibration
  g4: Cup and liquid calibration, and the camera gate
  g5: Slosh checking and identification
  g6: Trajectory planning
  g7: Controller
  g8: With vs without comparison
  g9: Analysis and records
stages:
  host_check:
    num: "0.1"
    gate: true
    group: g0
    title: Linux machine ready
    purpose: Check the machine that will run the arm tools and the RT process before a session (added stage)
    plan: codebase §2 (where the code runs), §6 (threads), §8 (disks); research §0 (compute)
    modes: [analysis]
    status: built
    tool: tools.host_check
    requires: []
    inputs:
      - The Linux machine, with the repo and Python 3.12
    adjust: [data_free_gb_min]
    criteria:
      linux:
        text: Linux, not WSL, so that arm runs are allowed (link.arm_host_problem)
        kind: auto
        metric: arm_host_ok
        op: is_true
      monotonic:
        text: Monotonic clock resolution of 1 microsecond or better
        kind: auto
        metric: monotonic_resolution_s
        op: le
        value: 0.000001
      disk:
        text: Free space under data/ at least data_free_gb_min
        kind: auto
        metric: data_free_gb
        op: ge
        coeff: data_free_gb_min
      rt_kernel:
        text: PREEMPT_RT kernel and isolated cores, as decided in week 1 (codebase §6) [unverified]
        kind: operator
      backup_target:
        text: The backup disk is mounted (codebase §8)
        kind: operator
    output: data/workbench/results/host_check/
  preflight:
    num: "0.2"
    group: g0
    title: Pre-flight and safety (every session)
    purpose: The bench is safe and recorded before anything moves; repeated every session
    plan: codebase §3.8 items 2, 6, 8; research §0 (holder, cup, lighting), §3.1 item 3, R6, R15
    modes: [form]
    status: built
    tool: form
    per_session: true
    requires: [host_check]
    inputs:
      - Arm powered from the pendant, e-stop within reach, scale, thermometer [MISSING H6]
    adjust: [nominal_fills, water_temp_range_c]
    fields:
      estop_test:
        label: "E-stop test, arm still: pressing it cuts the arm's 48 V (elfin_overview.md, PROTO p.60); ReadRobotState shows nEmergencyStop = 1 (PROTO p.61-62); after the reset (turn the button, LINUX p.11) the arm is unpowered and is powered on again from the pendant (LINUX p.122)"
        type: check
      workspace_clear:
        label: "Workspace clear; nothing in the arm's reach except the cup holder"
        type: check
      tray_shield:
        label: Drip tray under the path and the drip shield over the lens fitted (R6)
        type: check
      cables:
        label: Camera and arm cables routed and strain-relieved for the full path
        type: check
      holder_bolts:
        label: Holder flange bolts (ISO 9409-1-50-4-M6) and cup clamp checked
        type: check
      lighting_fixed:
        label: Lighting fixed and recorded (set-up ID below)
        type: check
      lighting_setup:
        label: Lighting set-up ID
        type: text
      payload_g:
        label: Payload weighed (holder + cup + water), g
        type: number
      fill_height_mm:
        label: Fill height you measured, mm (the flat surface, not the meniscus at the wall)
        type: number
      water_temp_c:
        label: Water temperature, degC
        type: number
    criteria:
      temp_ok:
        text: Water temperature inside water_temp_range_c
        kind: auto
        metric: water_temp_c
        op: in_range
        coeff: water_temp_range_c
    output: data/workbench/results/preflight/ (one per session); journal line
  bringup_read:
    num: "1.1"
    group: g1
    title: "Bring-up read: identity, limits, frames"
    purpose: Read the model string, the limits and the current frames; paste the limits into e03pro.yaml; read again to check
    plan: codebase §3.8 item 8, §11 week 1; research §9 week 1; elfin_examples.md example 1
    modes: [dry-run, mock, arm]
    status: built
    tool: tools.elfin_py.bringup_read
    options:
      controller_version:
        flag: "--controller-version"
        label: "Controller version as the pendant's About screen shows it (LINUX p.19)"
    requires: [preflight]
    files: ["config/arm/e03pro.yaml#limits_readback", "config/arm/e03pro.yaml#mounting"]
    inputs:
      - "Arm powered (nElectrify = 1); the tool never enables"
      - e03pro.yaml address; joint ranges from the pendant (LINUX p.50) entered by the owner
    adjust: []
    criteria:
      ran:
        text: Every read answered, no problems listed (limits and frames match e03pro.yaml)
        kind: auto
        metric: problems
        op: eq
        value: 0
      limits:
        text: All four limit reads present (ReadJointMaxVel/Acc/Jerk, ReadLinearMaxVel; PROTO p.56-59)
        kind: auto
        metric: limits_read
        op: is_true
      recorded:
        text: "e03pro.yaml limits_readback has this arm's values and record ID (pasted, then read again)"
        kind: auto
        metric: limits_in_config
        op: is_true
      ranges:
        text: Joint ranges entered in e03pro.yaml from the pendant (sources disagree, elfin_overview.md)
        kind: operator
    output: limits block for e03pro.yaml; trial .bin (scratch)
  state_stream:
    num: "1.2"
    group: g1
    title: State stream
    purpose: Rate, format and keys of the Datasheet on port 10004; are e-stop and light-curtain keys present
    plan: codebase §3.8 item 7; elfin_commands.md PROTO p.7, p.185-188; example 4
    modes: [dry-run, mock, arm]
    status: built
    tool: tools.elfin_py.state_stream
    requires: [bringup_read]
    files: ["config/arm/e03pro.yaml#address"]
    inputs:
      - Port 10004 reachable
    adjust: [state_gap_mean_ms_range, state_gap_max_ms]
    criteria:
      packets:
        text: Packets received and no stream error
        kind: auto
        metric: stream_ok
        op: is_true
      rate:
        text: Mean packet interval inside state_gap_mean_ms_range (20 Hz, PROTO p.7)
        kind: auto
        metric: gap_mean_ms
        op: in_range
        coeff: state_gap_mean_ms_range
      gaps:
        text: Longest interval at most state_gap_max_ms
        kind: auto
        metric: gap_max_ms
        op: le
        coeff: state_gap_max_ms
      safety_keys:
        text: "Recorded which safety keys the packets carry (none means the ladder must test ReadRobotState between pushes, §3.8 item 7)"
        kind: operator
    output: trial .bin with state_raw and robot_state
  move_test:
    num: "1.3"
    group: g1
    title: First enable and move
    purpose: "Enable, J6 +10 deg, flange 20 mm up, and back; tests whether '20.0000' is accepted [UNTESTED]"
    plan: codebase §1 R-B, §3.8 items 2-5, 8; elfin_examples.md example 2
    modes: [dry-run, mock, arm]
    status: built
    tool: tools.elfin_py.move_test
    args: ["--return"]
    requires: [bringup_read, state_stream]
    files: ["config/arm/confirmed.yaml", "config/arm/e03pro.yaml#mounting", "config/arm/e03pro.yaml#limits_readback", "config/arm/e03pro.yaml#joint_ranges_deg"]
    inputs:
      - Limits recorded (1.1), payload and TCP confirmed on the pendant at the prompt
    adjust: []
    criteria:
      done:
        text: Both moves and the return done, no Fail, GrpDisable on exit
        kind: auto
        metric: completed
        op: is_true
      format:
        text: The controller accepted 4-decimal numbers in WayPoint (else add a FORMAT_OVERRIDES entry)
        kind: auto
        metric: format_accepted
        op: is_true
      watched:
        text: "Watched: brakes released with sound and slight movement only (LINUX p.17-18); moves as planned"
        kind: operator
    output: trial .bin (scratch)
  servo_ladder:
    num: "1.4"
    group: g1
    title: Servo ladder (one period per run)
    purpose: "Stream a slow J6 sine at the period in confirmed.yaml; the owner lowers the period between runs"
    plan: codebase §3.8 items 5-7 and the first-run table; research §9 week 1; elfin_commands.md PROTO p.172-175
    modes: [dry-run, mock, arm]
    status: built
    tool: tools.elfin_py.servo_ladder
    requires: [move_test]
    files: ["config/arm/confirmed.yaml", "config/arm/e03pro.yaml#servo_in_use", "config/arm/e03pro.yaml#mounting"]
    inputs:
      - "confirmed.yaml servo_period_s (0.2 -> 0.1 -> 0.05 -> 0.04 -> 0.03 -> 0.02 -> 0.015 -> 0.01 s), lookahead 0.02 s"
    adjust: [servo_period_s, ladder_late_limit, ladder_guard_other_joints_deg, ladder_guard_j6_margin_deg, ladder_state_stale_s]
    criteria:
      verdict:
        text: "No stop rule fired: no Fail, <= 1 % late, median reply <= T_s/2, J6 tracks, no roughness"
        kind: auto
        metric: verdict_ok
        op: is_true
      after:
        text: Recorded what the arm did when pushes stopped and what GrpStop did [UNTESTED]
        kind: operator
    output: trial .bin (killtest) and .summary.json; the owner then confirms the next period in confirmed.yaml
  pose_record:
    num: "1.5"
    group: g1
    title: Pose recording for the FK check
    purpose: About 20 ReadActPos poses on the bare flange with zero TCP and user frame
    plan: research §0 (kinematic model), §9 week 1; codebase §9 (FK row)
    modes: [dry-run, mock, arm]
    status: built
    tool: tools.elfin_py.pose_recorder
    requires: [move_test]
    files: ["config/arm/fk_poses.yaml", "config/arm/confirmed.yaml", "config/arm/e03pro.yaml#mounting", "config/arm/e03pro.yaml#joint_ranges_deg"]
    inputs:
      - "The owner's poses in config/arm/fk_poses.yaml, including single-joint moves"
    adjust: []
    criteria:
      all:
        text: Every pose in fk_poses.yaml recorded
        kind: auto
        metric: all_poses
        op: is_true
    output: trial .bin with the poses (scratch)
  arm_control:
    num: "1.6"
    group: g1
    title: Arm control (jog, start, middle and end points)
    purpose: Move the arm slowly with buttons, with the cup upright, and record and run start, middle and end points
    plan: codebase §3.8 items 1-5, 8; elfin_commands.md WayPoint (PROTO p.137-139), GrpStop (p.20), ReadActPos (p.66-67)
    modes: [dry-run, mock, arm]
    status: built
    tool: tools.elfin_py.jog
    requires: [move_test]
    files: ["config/arm/confirmed.yaml", "config/arm/e03pro.yaml#mounting"]
    inputs:
      - "The Arm control tab; linear moves only, orientation held, at jog_speed_mm_s and jog_acc_mm_s2 (never above confirmed.yaml)"
    adjust: [jog_speed_mm_s, jog_acc_mm_s2, jog_max_step_mm, jog_box_mm, workspace_box_mm, workspace_fan, path_dwell_s, jog_idle_timeout_s]
    criteria:
      ended:
        text: The session ended normally (exit code 0)
        kind: auto
        metric: exit_ok
        op: is_true
      no_fail:
        text: No reply from the controller was a Fail
        kind: auto
        metric: fail_replies
        op: eq
        value: 0
      no_refusal:
        text: No command was refused (jog box, step size, orientation, frames)
        kind: auto
        metric: refusal_count
        op: eq
        value: 0
      disabled:
        text: GrpDisable was answered OK on exit
        kind: auto
        metric: grpdisable_ok
        op: is_true
    output: trial .bin (scratch); points in data/workbench/points/
  payload_tcp:
    num: "2.1"
    group: g2
    title: Payload and TCP CUPRIM
    purpose: With the holder on, set payload and TCP on the pendant, update e03pro.yaml, and check them with a bring-up read
    plan: codebase §3.8 item 8; research §3.1 item 3
    modes: [form]
    status: built
    tool: form
    requires: [bringup_read]
    files: ["config/arm/e03pro.yaml#mounting"]
    inputs:
      - Weighed holder + cup + water; centre of mass from CAD; the flange axes from the jog test [MISSING F3]
    adjust: [payload_kg, tcp_name]
    fields:
      jog_axes:
        label: Flange-frame axis directions found by jogging each tool axis at the slowest jog speed (research §3.1)
        type: check
      pendant_payload:
        label: Pendant payload = weighed mass, centre of mass converted into the flange frame (SetPayload units kg, mm; PROTO p.48)
        type: check
      cuprim:
        label: TCP CUPRIM taught at the cup axis, rim height; e03pro.yaml mounting updated to match
        type: check
    criteria:
      readback:
        text: Bring-up read (1.1) re-run with this mounting and accepted on the arm (frames match the config)
        kind: auto
        metric: bringup_fresh
        op: is_true
    output: e03pro.yaml mounting (edited by the owner); form record
  fk_check:
    num: "2.2"
    group: g2
    title: FK check against ReadActPos
    purpose: Our FK against the recorded poses; positions first, then orientations once the Rx, Ry, Rz convention is known
    plan: codebase §9 (FK row), §11 week 2; research §0 (kinematic model)
    modes: [analysis]
    status: planned
    tool: analysis/fk_check.py (needs the E03-Pro kinematic model [MISSING F1])
    requires: [pose_record]
    inputs:
      - Accepted pose recording (1.5); the kinematic model
    adjust: []
    criteria:
      positions:
        text: "Position error per pose within the memo's tolerance [MISSING tolerance]"
        kind: operator
    output: docs/memos/fk-check.md
  actuation_delay:
    num: "2.3"
    group: g2
    title: Actuation delay and servo response
    purpose: Camera on a static table target, chirp on one wrist joint; tau_a, lag model, lookahead effect
    plan: research §4 item 3; codebase §11 week 2 (tools/latency_chirp)
    modes: [dry-run, mock, arm]
    status: planned
    tool: tools/latency_chirp (planned)
    requires: [servo_ladder, camera_timing]
    inputs:
      - Static target [MISSING H5]; confirmed period
    adjust: []
    criteria:
      record:
        text: tau_a record written with its fit residual
        kind: operator
    output: data/latency/<id>/ (tau_a and the servo-response fit)
  gamma_model:
    num: "2.4"
    group: g2
    title: Commanded-gamma and tracking-error model
    purpose: The error between commanded and actual effective gravity (R13), for the d state of the estimator
    plan: research §2.1, §4, R13
    modes: [analysis]
    status: planned
    tool: analysis/identify (planned)
    requires: [actuation_delay, fk_check]
    inputs:
      - tau_a record; FK
    adjust: []
    criteria:
      residual:
        text: Servo-model residual documented; process noise on d sized from it
        kind: operator
    output: data/latency/<id>/servo_model
  intrinsics:
    num: "3.1"
    group: g3
    title: Camera intrinsics, focus, exposure, gain
    purpose: ChArUco calibration; fisheye vs rational model on held-out images; focus and iris locked
    plan: research §3.1 item 1, §7.1 kill test 2(b); codebase §11 week 3 (tools/calib)
    modes: [analysis]
    status: planned
    tool: tools/calib (planned; camera library [MISSING F11])
    requires: [host_check]
    inputs:
      - ChArUco board [MISSING H3]; shim [MISSING H8]
    adjust: [exposure_s, gain_db, frame_rate_hz, charuco_square_mm, charuco_images, reproj_rms_max_px]
    criteria:
      rms:
        text: RMS reprojection error on held-out images at most reproj_rms_max_px
        kind: auto
        metric: reproj_rms_px
        op: le
        coeff: reproj_rms_max_px
    output: data/calib/<id>/ (model, held-out error)
  cup_pose:
    num: "3.2"
    group: g3
    title: Cup pose, ray table and masks
    purpose: T_KC from the rim target; the ray table; the rim-tab mask
    plan: research §2.3, §3.1 item 1
    modes: [analysis]
    status: planned
    tool: tools/calib (planned)
    requires: [intrinsics]
    inputs:
      - Rim target [MISSING H4]; cup wall thickness [MISSING F12]
    adjust: [n_sectors, ray_half_window_px, rim_residual_max_px, calibration_id]
    criteria:
      rim:
        text: Rim-registration residual at most rim_residual_max_px
        kind: auto
        metric: rim_residual_px
        op: le
        coeff: rim_residual_max_px
    output: data/calib/<id>/ (T_KC, ray table, masks); calibration_id
  camera_timing:
    num: "3.3"
    group: g3
    title: Camera timing (kill test 2(c))
    purpose: Frame-interval jitter, dropped frames, tau_cam by the LED test, image-stage time
    plan: research §7.1 kill test 2(c); codebase §5 (LED and trigger), §9
    modes: [analysis]
    status: planned
    tool: tools/cam_bench and tools/led_latency (planned)
    requires: [host_check]
    inputs:
      - LED and its driver [MISSING H1]; trigger device if triggered [MISSING H2]
    adjust: [timing_test_s, jitter_max_ms, tau_cam_max_ms, dropped_frames_max]
    criteria:
      jitter:
        text: Jitter at most jitter_max_ms
        kind: auto
        metric: jitter_ms
        op: le
        coeff: jitter_max_ms
      tau:
        text: tau_cam at most tau_cam_max_ms
        kind: auto
        metric: tau_cam_ms
        op: le
        coeff: tau_cam_max_ms
      drops:
        text: Dropped frames at most dropped_frames_max
        kind: auto
        metric: dropped_frames
        op: le
        coeff: dropped_frames_max
    output: data/latency/<id>/ (tau_cam, latch event)
  clock_align:
    num: "3.4"
    group: g3
    title: Clock alignment, camera and arm
    purpose: Camera clock to host (offset and drift), checked by the LED; arm state stream on the same host clock
    plan: research §4 (latency offsets 1); codebase §5 (two timestamps), §9 (clock fit)
    modes: [analysis]
    status: planned
    tool: tools/clock_sync (planned)
    requires: [camera_timing, state_stream]
    inputs:
      - LED events in sync records
    adjust: []
    criteria:
      fit:
        text: Clock-fit residual against the LED documented
        kind: operator
    output: data/latency/<id>/ (clock check)
  latency_memo:
    num: "3.5"
    group: g3
    title: Latency memo (week-1 deliverable)
    purpose: Confirmed T_s, push reply times and tau_cam in one memo
    plan: codebase §11 week 1 (done criterion), §3.7 P3
    modes: [form]
    status: built
    tool: form
    requires: [servo_ladder, camera_timing]
    inputs:
      - Accepted ladder results; camera timing
    adjust: []
    fields:
      memo:
        label: docs/memos/latency.md written (what was measured, what was decided, what would reverse it)
        type: check
    criteria:
    output: docs/memos/latency.md
  meniscus_map:
    num: "4.1"
    group: g4
    title: Meniscus offset and fill map
    purpose: 3-5 levels at rest, each measured by the owner; camera fill estimate against the measured height
    plan: research §3.1 item 2
    modes: [analysis]
    status: planned
    tool: analysis (planned; needs 3.2)
    requires: [cup_pose]
    adjust: [meniscus_levels, meniscus_map_id]
    inputs:
      - Calibration record; fill heights measured by the owner, clear and dyed (dyed gives the offset for CNN labels, docs/design/cnn_fallback.md)
    criteria:
      h:
        text: Camera fill estimate within fill_tolerance_mm of the measured height
        kind: auto
        metric: fill_error_mm
        op: abs_le
        coeff: fill_tolerance_mm
    output: meniscus map in the calibration record; meniscus_map_id
  frontend_tune:
    num: "4.2"
    group: g4
    title: Contact-line front-end tuning
    purpose: Window, smoothing and thresholds per lighting set-up, on dyed water first, then clear
    plan: research §2.3, §9 week 3
    modes: [analysis]
    status: planned
    tool: rt/core/frontend/camera via the replay driver (planned)
    requires: [meniscus_map]
    adjust: [edge_method, liquid, lighting_setup, edge_smoothing_px, c_min, n_valid_min, quadrant_min, gate_sigma]
    inputs:
      - Stored images of static scenes and ring-downs
    criteria:
      bias:
        text: Sub-pixel bias on synthetic images below 0.05 px [target] (codebase §9)
        kind: operator
    output: front-end settings (coefficient version)
  static_ringdowns:
    num: "4.3"
    group: g4
    title: Static ring-downs (kill test 2(a)); moved here from stage 5 because the gate needs them
    purpose: Kicks giving about 0.5-10 mm crest; 40/60/80 %; clear and dyed; every lighting set-up
    plan: research §7.1 kill test 2(a)
    modes: [dry-run, mock, arm]
    status: planned
    tool: shake trial (planned) + analysis/identify/ringdown.py (built)
    requires: [frontend_tune, servo_ladder]
    adjust: [kick_mm, kick_s, hold_s]
    inputs:
      - Confirmed period and speeds; lighting set-ups [MISSING Q5]
    criteria:
      table:
        text: Per-frame noise and dead-band table written for every set-up
        kind: operator
    output: per-set-up noise, bias, dead band, meniscus offset
  camera_gate:
    num: "4.4"
    group: g4
    title: The kill-test-2 gate (Part 1)
    purpose: "The front-end in clear water, at least one lighting set-up; six numbers; pass, or the next step: classical first, the CNN after 4.5 (gate memo v2)"
    plan: research §7.1 (gate), §2.3, §0 amendment, §8 (R1)
    modes: [analysis]
    status: built
    tool: analysis.gate_memo
    requires: [static_ringdowns, intrinsics, camera_timing]
    files: ["data/workbench/gate_input.json"]
    adjust: [gate_sigma_s_max_mm, gate_track_min_crest_mm, gate_deadband_window_s_min]
    inputs:
      - "data/workbench/gate_input.json: per set-up numbers from 3.1, 3.3 and 4.3; front_end; for a failed item 6, deadband_cause (pinning or edge_step, the owner's call from the ring-down plots)"
    criteria:
      passed:
        text: At least one clear-water set-up passes all six (else the memo names the next step; the CNN only for edge-step failures)
        kind: auto
        metric: any_setup_passes
        op: is_true
      front_end:
        text: The front-end whose numbers these are has passed its own stage (the CNN only after stage 4.5)
        kind: auto
        metric: front_end_accepted
        op: is_true
    output: docs/memos/camera-gate.md
  cnn_frontend:
    num: "4.5"
    group: g4
    title: CNN front-end (only if the gate fails)
    purpose: "Only after the gate memo says the CNN fallback applies: labels, training, C++ inference, parity, acceptance on held-out sessions and lighting; then 4.4 again with its numbers (gate memo v2)"
    plan: docs/design/cnn_fallback.md; research §0 amendment, §2.3, §7.1, R16
    modes: [analysis]
    status: conditional
    tool: analysis/cnn and tools/label (not built until the gate memo says fail)
    requires: [static_ringdowns, intrinsics, camera_timing]
    adjust: [edge_method, c_min, n_valid_min, quadrant_min]
    inputs:
      - Gate memo saying fail; labels
    criteria:
      gate:
        text: The six gate numbers on held-out data, calibration, R0-R2 refitted, dyed comparison
        kind: operator
    output: data/cnn/models/<id>/ and gate memo v2
  pickup_shake:
    num: "5.1"
    group: g5
    title: Per-pickup shake and identification
    purpose: "About 3 s shake: f0 and zeta from the ring-down, dispersion check, isotropy, repeatability over >= 30 pickups"
    plan: research §3.2; codebase §11 (where identification runs)
    modes: [dry-run, mock, arm]
    status: planned
    tool: shake trial (planned) + analysis/identify/ringdown.py (built)
