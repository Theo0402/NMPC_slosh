camera:
  model: MV-CS016-10UM     # Hikrobot; Sony IMX273, 1440 x 1080, 3.45 um, <= 249.1 fps full frame (README)
  serial: null
  library: null            # [MISSING: choice] week 1
  pixel_format: Mono8
  roi: [0, 0, 1440, 1080]  # offset_x, offset_y, width, height, px
  exposure_s: null         # <= 0.001 [target]
  gain_db: null
  frame_rate_hz: 200.0     # [target]
  trigger_mode: null       # [MISSING: choice] free_run | line0
  timestamp_tick_hz: null  # as reported by the camera; the true rate is [MISSING] until measured
